version: '3.8'

services:
  # Reverse Proxy with automatic HTTPS
  traefik:
    image: traefik:v3.0
    container_name: sail-traefik
    command:
      - "--api.insecure=true"
      - "--providers.docker=true"
      - "--providers.docker.exposedbydefault=false"
      - "--entrypoints.web.address=:80"
      - "--entrypoints.web.http.redirections.entrypoint.to=websecure"
      - "--entrypoints.websecure.address=:443"
    ports:
      - "80:80"
      - "443:443"
      - "8080:8080"  # Traefik dashboard
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
    restart: always

  # PostgreSQL Database
  postgres:
    image: postgres:15-alpine
    container_name: sail-postgres
    environment:
      POSTGRES_DB: sail_platform
      POSTGRES_USER: sail_user
      POSTGRES_PASSWORD: sail_secure_password_2024
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    restart: always
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sail_user"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Mailcatcher for email testing (development)
  mailcatcher:
    image: schickling/mailcatcher
    container_name: sail-mailcatcher
    ports:
      - "1080:1080"  # Web interface
      - "2525:2525"  # SMTP port
    restart: always

  # FastAPI Backend
  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    container_name: sail-backend
    environment:
      DATABASE_URL: postgresql://sail_user:sail_secure_password_2024@postgres:5432/sail_platform
      SECRET_KEY: ${SECRET_KEY:-change-this-secret-key-in-production}
      JWT_ALGORITHM: HS256
      ACCESS_TOKEN_EXPIRE_MINUTES: 30
      MAIL_SERVER: mailcatcher
      MAIL_PORT: 2525
      MAIL_USE_TLS: false
    depends_on:
      postgres:
        condition: service_healthy
    restart: always
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.backend.rule=Host(`api.sail.local`)"
      - "traefik.http.services.backend.loadbalancer.server.port=8000"

  # React Frontend
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: sail-frontend
    environment:
      VITE_API_URL: http://api.sail.local
    depends_on:
      - backend
    restart: always
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.frontend.rule=Host(`sail.local`)"
      - "traefik.http.services.frontend.loadbalancer.server.port=5173"

volumes:
  postgres_data: